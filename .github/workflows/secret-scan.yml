name: Public repository safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-repository-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secrets and private runtime files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reject committed local secrets and runtime files
        run: node scripts/check-public-files.mjs
      - name: Install verified secret scanner
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$RUNNER_TEMP/gitleaks.tar.gz"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          touch "$RUNNER_TEMP/empty.gitleaksignore"
      - name: Scan tracked contents
        run: |
          mkdir "$RUNNER_TEMP/source-snapshot"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/source-snapshot"
          "$RUNNER_TEMP/gitleaks" dir "$RUNNER_TEMP/source-snapshot" \
            --config .gitleaks.toml --redact --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty.gitleaksignore" --no-banner
      - name: Scan introduced commits, including subsequently deleted secrets
        env:
          SCAN_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          SCAN_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          [[ "$SCAN_HEAD" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            scan_range=--all
          elif [[ "$SCAN_BASE" =~ ^0{40}$ ]]; then
            scan_range="$SCAN_HEAD"
          else
            [[ "$SCAN_BASE" =~ ^[a-f0-9]{40}$ ]]
            git cat-file -e "$SCAN_BASE^{commit}"
            scan_range="$SCAN_BASE..$SCAN_HEAD"
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$scan_range" \
            --config .gitleaks.toml --redact --ignore-gitleaks-allow \
            --gitleaks-ignore-path "$RUNNER_TEMP/empty.gitleaksignore" --no-banner
