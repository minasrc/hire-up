name: Telegram source maintenance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-source-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Purge released sources and expired search caches
        run: node scripts/run-telegram-maintenance.mjs
        env:
          TELEGRAM_MAINTENANCE_URL: ${{ secrets.TELEGRAM_MAINTENANCE_URL }}
          TELEGRAM_MAINTENANCE_SECRET: ${{ secrets.TELEGRAM_MAINTENANCE_SECRET }}
