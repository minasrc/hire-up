name: Telegram source maintenance

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  maintenance:
    uses: ./.github/workflows/telegram-maintenance-run.yml
    secrets:
      TELEGRAM_MAINTENANCE_URL: ${{ secrets.TELEGRAM_MAINTENANCE_URL }}
      TELEGRAM_MAINTENANCE_SECRET: ${{ secrets.TELEGRAM_MAINTENANCE_SECRET }}
