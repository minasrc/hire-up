name: CI

on:
  pull_request:
    branches: [main, 'feat/telegram-*']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select validation
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      runners: ${{ steps.select.outputs.runners }}
      app_checks: ${{ steps.select.outputs.app_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select affected checks or reuse identical validated code
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs

  quality:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['quality'] }}
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser_build_id: ${{ steps.upload-browser-build.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        if: needs.plan.outputs.app_checks == 'true'
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production application
        if: needs.plan.outputs.app_checks == 'true'
        env:
          E2E_REAL_BACKEND: '0'
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: local-playwright-secret
        run: |
          node --input-type=module -e 'await import("./playwright.config.mjs")'
          npm run build
      - name: Package browser build
        if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
        run: tar --exclude='.next/cache' -czf "$RUNNER_TEMP/browser-build.tgz" .next
      - name: Share browser build
        if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
        id: upload-browser-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-build.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser-tests:
    needs: [plan, quality]
    if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the build from this workflow
        env:
          BUILD_ARTIFACT_ID: ${{ needs.quality.outputs.browser_build_id }}
        run: '[[ "$BUILD_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - name: Download browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.quality.outputs.browser_build_id }}
          path: ${{ runner.temp }}/browser-build
          merge-multiple: true
      - name: Restore browser build
        run: |
          tar -xzf "$RUNNER_TEMP/browser-build/browser-build.tgz"
          test -s .next/BUILD_ID
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          E2E_SERVER_MODE: production
          E2E_REAL_BACKEND: '0'
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: local-playwright-secret
        run: npm run test:e2e -- --output=test-results/browser-ci
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-ci/
          if-no-files-found: ignore
          retention-days: 3

  database-foundation:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-foundation'] }}
    name: Database foundation (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [postgres, supabase]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        if: matrix.mode == 'supabase'
        run: npx playwright install --with-deps chromium
      - name: Run foundation database tests
        env:
          FOUNDATION_TEST_MODE: ${{ matrix.mode }}
        run: npm run test:db:foundation

  database-checks:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.runners)['database-checks'] }}
    name: Selected database checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once for this group
        run: npm ci
      - name: Run selected suites sequentially with isolated databases
        run: node scripts/run-ci-group.mjs database-checks

  staff-workflows:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.runners)['staff-workflows'] }}
    name: Staff workspace, review and pairing
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once for this group
        run: npm ci
      - name: Install Chromium once for this group
        run: npx playwright install --with-deps chromium
      - name: Run selected suites sequentially with isolated databases
        run: node scripts/run-ci-group.mjs staff-workflows

  telegram-workflows:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.runners)['telegram-workflows'] }}
    name: Selected Telegram workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once for this group
        run: npm ci
      - name: Install Chromium once for this group
        run: npx playwright install --with-deps chromium
      - name: Install isolated Telegram SDK once
        if: ${{ fromJSON(env.CI_SELECTION)['telegram-connection'] || fromJSON(env.CI_SELECTION)['telegram-history'] || fromJSON(env.CI_SELECTION)['telegram-source-updates'] || fromJSON(env.CI_SELECTION)['telegram-cv'] }}
        run: npm ci --ignore-scripts --prefix services/telegram-connector
      - name: Check installed Telegram SDK without connecting
        if: ${{ fromJSON(env.CI_SELECTION)['telegram-connection'] || fromJSON(env.CI_SELECTION)['telegram-history'] || fromJSON(env.CI_SELECTION)['telegram-source-updates'] }}
        run: |
          node services/telegram-connector/check-runtime.mjs
          node --test tests/telegram-connector/native-sdk.test.js
          node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --strict --target es2022 --module nodenext --moduleResolution nodenext services/telegram-connector/sdk-contract.mts
      - name: Run selected suites sequentially with isolated databases
        run: node scripts/run-ci-group.mjs telegram-workflows

  search-workflows:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.runners)['search-workflows'] }}
    name: Selected search and CV workflows
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI_SELECTION: ${{ needs.plan.outputs.selection }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies once for this group
        run: npm ci
      - name: Install Chromium once for this group
        run: npx playwright install --with-deps chromium
      - name: Set up Python for profile search
        if: ${{ fromJSON(env.CI_SELECTION)['profile-search'] }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/local-embeddings/requirements-test.lock
      - name: Install embedding service test dependencies
        if: ${{ fromJSON(env.CI_SELECTION)['profile-search'] }}
        run: python -m pip install -r services/local-embeddings/requirements-test.lock
      - name: Verify loopback service and inference scheduling
        if: ${{ fromJSON(env.CI_SELECTION)['profile-search'] }}
        working-directory: services/local-embeddings
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Install pinned parser test dependencies
        if: ${{ fromJSON(env.CI_SELECTION)['cv-analysis'] }}
        run: npm ci --prefix services/cv-analysis-worker --ignore-scripts
      - name: Build the pinned isolated CV parser
        if: ${{ fromJSON(env.CI_SELECTION)['cv-analysis'] }}
        run: docker build -t agora-cv-parser:v1 services/cv-analysis-worker
      - name: Run selected suites sequentially with isolated databases
        run: node scripts/run-ci-group.mjs search-workflows

  validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [plan, quality, browser-tests, database-foundation, database-checks, staff-workflows, telegram-workflows, search-workflows]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/run-ci-group.mjs validate
