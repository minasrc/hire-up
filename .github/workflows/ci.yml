name: CI

on:
  pull_request:
    branches: [main, 'feat/telegram-*']
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  plan:
    name: Select validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      selection: ${{ steps.select.outputs.selection }}
      app_checks: ${{ steps.select.outputs.app_checks }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Select affected checks or reuse identical validated code
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-selection.mjs

  quality:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['quality'] }}
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      browser_build_id: ${{ steps.upload-browser-build.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        if: needs.plan.outputs.app_checks == 'true'
        run: npm run typecheck
      - name: Run unit tests
        run: npm test
      - name: Build production application
        if: needs.plan.outputs.app_checks == 'true'
        env:
          E2E_REAL_BACKEND: '0'
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: local-playwright-secret
        run: |
          node --input-type=module -e 'await import("./playwright.config.mjs")'
          npm run build
      - name: Package browser build
        if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
        run: tar --exclude='.next/cache' -czf "$RUNNER_TEMP/browser-build.tgz" .next
      - name: Share browser build
        if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
        id: upload-browser-build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/browser-build.tgz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  browser-tests:
    needs: [plan, quality]
    if: ${{ fromJSON(needs.plan.outputs.selection)['browser-tests'] }}
    name: Browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Require the build from this workflow
        env:
          BUILD_ARTIFACT_ID: ${{ needs.quality.outputs.browser_build_id }}
        run: '[[ "$BUILD_ARTIFACT_ID" =~ ^[0-9]+$ ]]'
      - name: Download browser build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ needs.quality.outputs.browser_build_id }}
          path: ${{ runner.temp }}/browser-build
          merge-multiple: true
      - name: Restore browser build
        run: |
          tar -xzf "$RUNNER_TEMP/browser-build/browser-build.tgz"
          test -s .next/BUILD_ID
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          E2E_SERVER_MODE: production
          E2E_REAL_BACKEND: '0'
          NEXT_PUBLIC_SUPABASE_URL: ''
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ''
          SUPABASE_SERVICE_ROLE_KEY: ''
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: local-playwright-secret
        run: npm run test:e2e -- --output=test-results/browser-ci
      - name: Preserve browser failures
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-failures-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/browser-ci/
          if-no-files-found: ignore
          retention-days: 3

  database-foundation:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-foundation'] }}
    name: Database foundation (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [postgres, supabase]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        if: matrix.mode == 'supabase'
        run: npx playwright install --with-deps chromium
      - name: Run foundation database tests
        env:
          FOUNDATION_TEST_MODE: ${{ matrix.mode }}
        run: npm run test:db:foundation

  database-staff-authorization:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-staff-authorization'] }}
    name: Database staff authorization
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run staff authorization database tests
        run: npm run test:db:staff

  database-privacy-foundation:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-privacy-foundation'] }}
    name: Database privacy foundation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run privacy foundation database tests
        run: npm run test:db:privacy

  database-privacy-operations:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-privacy-operations'] }}
    name: Database privacy operations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run privacy operations database tests
        run: npm run test:db:privacy-operations

  database-client-jobs:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-client-jobs'] }}
    name: Database client and job workflows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run client and job workflow database tests
        run: npm run test:db:client-jobs

  staff-workspace:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['staff-workspace'] }}
    name: Authenticated staff workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify staff database and authenticated workflows
        run: npm run test:staff-workspace
      - name: Candidate upload database regression
        run: npm run test:db:candidate-upload

  duplicate-review:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['duplicate-review'] }}
    name: Candidate duplicate review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify duplicate review and merge
        run: npm run test:duplicate-review

  database-staff-totp:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['database-staff-totp'] }}
    name: Database staff TOTP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run staff TOTP database tests
        run: npm run test:db:totp

  telegram-intake:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-intake'] }}
    name: Private Telegram intake
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify private draft and scoped worker boundaries
        run: npm run test:telegram-intake

  telegram-connection:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-connection'] }}
    name: Telegram connection
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated Mac connector dependencies
        run: npm ci --ignore-scripts --prefix services/telegram-connector
      - name: Check installed Telegram SDK without connecting
        run: |
          node services/telegram-connector/check-runtime.mjs
          node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --strict --target es2022 --module nodenext --moduleResolution nodenext services/telegram-connector/sdk-contract.mts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify private Telegram login and disconnect
        run: npm run test:telegram-connection


  telegram-history:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-history'] }}
    name: Telegram history import
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install isolated Mac connector dependencies
        run: npm ci --ignore-scripts --prefix services/telegram-connector
      - name: Check installed Telegram SDK without connecting
        run: |
          node services/telegram-connector/check-runtime.mjs
          node node_modules/typescript/bin/tsc --noEmit --skipLibCheck --strict --target es2022 --module nodenext --moduleResolution nodenext services/telegram-connector/sdk-contract.mts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify private selection and resumable history import
        run: npm run test:telegram-history

  telegram-extraction:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-extraction'] }}
    name: Telegram candidate extraction
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify extraction, retries and private candidate review
        run: npm run test:telegram-extraction

  telegram-cv:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-cv'] }}
    name: Telegram CV retrieval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install isolated Telegram SDK
        run: npm ci --ignore-scripts --prefix services/telegram-connector
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify retrieval, private storage and candidate review
        run: npm run test:telegram-cv

  profile-search:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['profile-search'] }}
    name: Private and approved profile search
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/local-embeddings/requirements-test.lock
      - name: Install application dependencies
        run: npm ci
      - name: Install embedding service test dependencies
        run: python -m pip install -r services/local-embeddings/requirements-test.lock
      - name: Verify loopback service and inference scheduling
        working-directory: services/local-embeddings
        run: python -m unittest discover -p 'test_*.py' -v
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify private indexing, worker restart and ranked search
        run: npm run test:profile-search

  telegram-retention:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['telegram-retention'] }}
    name: Telegram catch-up and reviewed source cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify automatic extraction and reviewed source lifecycle
        run: npm run test:telegram-retention

  cv-analysis:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['cv-analysis'] }}
    name: CV analysis and draft review
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned parser test dependencies
        run: npm ci --prefix services/cv-analysis-worker --ignore-scripts
      - name: Build the pinned isolated CV parser
        run: docker build -t agora-cv-parser:v1 services/cv-analysis-worker
      - name: Verify CV parsing, review, approval and cleanup
        run: npm run test:cv-analysis

  cv-search:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['cv-search'] }}
    name: Approved CV semantic search
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify CV indexing, access and ranked search
        run: npm run test:cv-search

  worker-pairing:
    needs: plan
    if: ${{ fromJSON(needs.plan.outputs.selection)['worker-pairing'] }}
    name: Mac worker pairing
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify pairing, recovery and device management
        run: npm run test:worker-pairing

  validation:
    name: CI validation
    if: always()
    runs-on: ubuntu-latest
    needs: [plan, quality, browser-tests, database-foundation, database-staff-authorization, database-privacy-foundation, database-privacy-operations, database-client-jobs, staff-workspace, duplicate-review, database-staff-totp, telegram-intake, telegram-connection, telegram-history, telegram-extraction, telegram-cv, profile-search, telegram-retention, cv-analysis, cv-search, worker-pairing]
    steps:
      - name: Reject failed, cancelled or unexpectedly skipped checks
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node <<'NODE'
          const results = JSON.parse(process.env.RESULTS);
          if (results.plan.result !== 'success') throw new Error('CI selection failed');
          const selected = JSON.parse(results.plan.outputs.selection);
          for (const [job, enabled] of Object.entries(selected)) {
            if (enabled && results[job]?.result !== 'success') {
              throw new Error(`Required job ${job}: ${results[job]?.result ?? 'missing'}`);
            }
          }
          console.log('All selected checks passed.');
          NODE
